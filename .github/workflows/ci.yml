name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests + coverage (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The paid-path install from README, plus the test tools from the `dev`
      # extra (minus jupyter, which the tests never import).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,audit]" pytest pytest-cov httpx
      # Paid path = geomine/audit + geomine/api. Floor from AGENT_TEAM.md §4 rule 7.
      - name: Test with coverage gate
        run: >
          pytest -q
          --cov=geomine/audit --cov=geomine/api
          --cov-report=term-missing
          --cov-fail-under=96

  reproduce:
    name: Benchmark certificate reproduces (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Exactly what BENCHMARK.md tells a stranger to run, in a fresh environment.
      # No pip cache on purpose: this job is the "clean clone" promise.
      - name: Install
        run: pip install -e ".[api,audit]"
      - name: Run the published reproduction command
        run: |
          geomine audit benchmark/dataset.parquet benchmark/model.joblib \
            --block-size-km 25.0 \
            --output "$RUNNER_TEMP/audit.md" \
            --json-output "$RUNNER_TEMP/audit.json"
      # If this fails, do NOT update the manifest to match. A changed certificate
      # means the published promise broke; escalate (AGENT_TEAM.md §4 rule 7).
      - name: Compare certificate to benchmark/manifest.json
        run: |
          python - <<'EOF'
          import json, os, sys
          expected = json.load(open("benchmark/manifest.json"))["certificate"]
          actual = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "audit.json")))["certificate"]
          print(f"expected {expected}\nactual   {actual}")
          sys.exit(0 if actual == expected else "Certificate mismatch: the reproducibility promise is broken.")
          EOF
