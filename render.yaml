# Render Blueprint for the hosted GeoMine audit API.
# Create it once from the Render dashboard (New > Blueprint > this repo); after that,
# every push to main redeploys.
services:
  - type: web
    name: geomine-api
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      # key_id:secret pairs, comma-separated (see geomine/api/auth.py).
      # sync: false means Render prompts for the value; it is never stored in this repo.
      - key: GEOMINE_API_KEYS
        sync: false
      - key: GEOMINE_RATE_LIMIT_PER_MINUTE
        value: "10"

  # The landing page: plain static files from site/, no build step. Static sites
  # don't sleep, unlike the free web service above.
  - type: web
    name: geomine-site
    runtime: static
    branch: main
    buildCommand: echo "static site, nothing to build"
    staticPublishPath: ./site
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
